services:
    db:
        image: postgres:16-alpine
        container_name: alentapp-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - alentapp-net
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M
                reservations:
                    memory: 256M
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    api:
        build:
            context: .
            dockerfile: packages/api/Dockerfile.prod
        image: alentapp-api:prod
        container_name: alentapp-api
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: '3000'
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
        ports:
            - '3000:3000'
            - '9464:9464'
        depends_on:
            db:
                condition: service_healthy
        networks:
            - alentapp-net
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: '0.75'
                    memory: 512M
                reservations:
                    memory: 256M
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    web:
        build:
            context: .
            dockerfile: packages/web/Dockerfile.prod
        image: alentapp-web:prod
        container_name: alentapp-web
        restart: unless-stopped
        ports:
            - '80:80'
        depends_on:
            - api
        networks:
            - alentapp-net
        read_only: true
        tmpfs:
            - /tmp
            - /var/cache/nginx
            - /var/run
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 128M
                reservations:
                    memory: 64M
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

networks:
    alentapp-net:
        driver: bridge

volumes:
    pgdata: